name: Import Next.js project
on:
  push:
    branches: [main]
    paths: [project-bundle.b64]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project bundle
        run: |
          base64 -d project-bundle.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm project-bundle.b64
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete United School of Excellence Next.js website" || exit 0
          git push
