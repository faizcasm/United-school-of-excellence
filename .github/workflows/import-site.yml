name: Import complete school website
on:
  push:
    branches: [main]
    paths:
      - project-bundle.tar.xz
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website source
        run: |
          mkdir -p /tmp/school-site
          tar -xJf project-bundle.tar.xz -C /tmp/school-site
          cp -a /tmp/school-site/united-school-of-excellence/. .
          rm project-bundle.tar.xz
      - name: Commit extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete United School of Excellence Next.js website"
          git push
